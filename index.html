<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Chat — 开源、不绑定的聊天应用</title>
<style>
* { box-sizing: border-box; }
:root {
  --bg: #0f1117;
  --panel: #161a24;
  --panel-2: #1d2230;
  --border: #262c3d;
  --text: #e6e9f2;
  --muted: #8b93a7;
  --accent: #5b8cff;
  --accent-2: #3d6ae8;
  --error: #ff6b6b;
  --radius: 12px;
}
html, body { height: 100%; }
body {
  margin: 0;
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}
/* ---------- top bar ---------- */
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
#topbar-title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge {
  font-size: 12px; font-weight: 400; color: var(--muted);
  background: var(--panel-2); border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 999px; margin-left: 10px;
  max-width: 240px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle;
}
.ghost-btn {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
}
.ghost-btn:hover { color: var(--text); border-color: var(--accent); }
.ghost-btn.tiny { padding: 2px 8px; font-size: 12px; }
/* ---------- settings drawer ---------- */
#settings {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: min(380px, 94vw);
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 20px; overflow-y: auto; z-index: 20;
  box-shadow: 8px 0 30px rgba(0,0,0,.45);
}
#settings.hidden { display: none; }
#settings h2 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
#settings label { display: block; margin: 14px 0 4px; font-size: 13px; color: var(--muted); }
input, select, textarea {
  width: 100%; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input[readonly] { opacity: .75; cursor: not-allowed; }
input[type="range"] { padding: 0; border: none; background: transparent; }
.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.row { display: flex; gap: 12px; align-items: flex-end; }
.row > label { flex: 1; }
code {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
  padding: 1px 5px; font-size: 13px; font-family: ui-monospace, Consolas, monospace;
}
/* ---------- chat area ---------- */
#chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#messages { flex: 1; overflow-y: auto; padding: 20px 0; }
.welcome { max-width: 720px; margin: 14vh auto 0; text-align: center; color: var(--muted); padding: 0 20px; }
.welcome h1 { color: var(--text); margin: 0 0 10px; }
.msg { display: flex; margin: 10px auto; max-width: 820px; width: 100%; padding: 0 20px; }
.msg .bubble {
  border-radius: var(--radius); padding: 10px 14px;
  background: var(--panel); border: 1px solid var(--border); max-width: 85%;
}
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--accent-2); border-color: var(--accent-2); }
.msg.assistant .bubble { max-width: 100%; }
.bubble.error { border-color: var(--error); }
.actions { margin-bottom: 6px; }
.muted { color: var(--muted); }
/* ---------- rendered markdown ---------- */
.md { overflow-wrap: break-word; }
.md p { margin: 6px 0; }
.md pre {
  background: #0b0d13; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; overflow-x: auto; margin: 8px 0;
}
.md pre code { background: none; border: none; padding: 0; }
.md ul { margin: 6px 0; padding-left: 20px; }
.md h1, .md h2, .md h3, .md h4 { margin: 12px 0 6px; line-height: 1.3; }
.md blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--accent); color: var(--muted); }
.md a { color: var(--accent); }
.md hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
/* ---------- composer ---------- */
#composer {
  display: flex; gap: 10px; align-items: flex-end;
  padding: 12px 16px 16px;
  max-width: 860px; width: 100%; margin: 0 auto;
  border-top: 1px solid var(--border);
}
#composer textarea { flex: 1; resize: none; max-height: 200px; }
#btn-send {
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: 9px 22px; font-size: 15px; cursor: pointer;
}
#btn-send:hover { background: var(--accent-2); }
#btn-stop {
  background: var(--error); color: #fff; border: none; border-radius: 8px;
  padding: 9px 16px; font-size: 15px; cursor: pointer;
}
.hidden { display: none !important; }
/* ---------- toast ---------- */
#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  padding: 8px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: .25s; z-index: 50; font-size: 13px;
  max-width: 86vw;
}
#toast.show { opacity: 1; transform: translateX(-50%); }
@media (max-width: 640px) {
  .msg .bubble { max-width: 100%; }
  #composer { padding: 10px 10px 12px; }
}
</style>
</head>
<body>
<header id="topbar">
  <div id="topbar-title">Open Chat<span id="model-badge" class="badge hidden"></span></div>
  <button id="btn-settings" class="ghost-btn">设置</button>
  <button id="btn-clear" class="ghost-btn">清空</button>
</header>

<aside id="settings" class="hidden">
  <h2>设置 <button id="btn-close-settings" class="ghost-btn tiny">关闭</button></h2>

  <label>接口地址（已固定）</label>
  <input id="s-base" value="https://ly.77625.xyz/v1" readonly>
  <p class="hint">已固定为 <code>https://ly.77625.xyz/v1</code>，通过 Puter.js 中继绕过浏览器 CORS。</p>

  <label>API Key（必填）</label>
  <input id="s-key" type="password" placeholder="sk-…">
  <p class="hint">Key 仅保存在本机 localStorage，不会上传。填入后自动获取模型列表。</p>

  <label>模型</label>
  <div class="row">
    <input id="s-model" placeholder="dsv4.1f">
    <button id="btn-refresh-models" class="ghost-btn tiny" title="从服务端拉取可用模型列表">刷新</button>
  </div>

  <label>系统提示词（可选）</label>
  <textarea id="s-system" rows="2" placeholder="例如：你是一个简洁的助手。"></textarea>

  <label>温度 <span id="s-temp-val">0.7</span></label>
  <input id="s-temp" type="range" min="0" max="1" step="0.1" value="0.7">
</aside>

<main id="chat">
  <div id="messages"></div>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="btn-send">发送</button>
    <button id="btn-stop" class="hidden">停止</button>
  </div>
</main>

<div id="toast"></div>

<script src="https://js.puter.com/v2/"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const settingsEl = $("settings"), messagesEl = $("messages"), inputEl = $("input"),
      sendBtn = $("btn-send"), stopBtn = $("btn-stop"), toastEl = $("toast");

const FIXED_BASE = "https://ly.77625.xyz/v1";

// 优先走 Puter.js 中继绕过 CORS；没有 Puter 时回退普通 fetch（可能被 CORS 拦截）
const apiFetch = (...args) => {
  if (window.puter?.net?.fetch) return puter.net.fetch(...args);
  if (window.puter?.fetch) return puter.fetch(...args);
  return fetch(...args);
};

const S = {
  get: () => JSON.parse(localStorage.getItem("openchat.settings") || "{}"),
  set: (o) => localStorage.setItem("openchat.settings", JSON.stringify(o)),
};
let messages = [];
let busy = false, aborter = null, toastTimer = null;

/* ---------- 对话历史 ---------- */
function saveHistory() {
  localStorage.setItem("openchat.history", JSON.stringify(messages));
}
function loadHistory() {
  try {
    const h = JSON.parse(localStorage.getItem("openchat.history") || "[]");
    if (!Array.isArray(h) || !h.length) return;
    messages = h;
    messagesEl.innerHTML = "";
    messages.forEach((m) =>
      addMsg(m.role, m.role === "user" ? escapeHtml(m.content).replace(/\n/g, "<br>") : renderMarkdown(m.content))
    );
  } catch { messages = []; }
}

/* ---------- settings ---------- */
function loadSettings() {
  const s = S.get();
  $("s-base").value = FIXED_BASE;
  $("s-base").readOnly = true;
  $("s-key").value = s.key || "";
  $("s-model").value = s.model || "";
  $("s-system").value = s.system || "";
  $("s-temp").value = s.temp ?? 0.7;
  $("s-temp-val").textContent = $("s-temp").value;
  updateBadge();
}
function saveSettings() {
  S.set({
    type: "openai",
    base: FIXED_BASE,
    key: $("s-key").value.trim(),
    model: $("s-model").value.trim(),
    system: $("s-system").value.trim(),
    temp: parseFloat($("s-temp").value),
  });
  updateBadge();
  toast("设置已保存");
}
function updateBadge() {
  const s = S.get(), badge = $("model-badge");
  if (s.model) { badge.textContent = s.model; badge.classList.remove("hidden"); }
  else badge.classList.add("hidden");
}

["s-key", "s-model", "s-system", "s-temp"].forEach((id) => {
  $(id).addEventListener("change", saveSettings);
  $(id).addEventListener("input", () => {
    if (id === "s-temp") $("s-temp-val").textContent = $("s-temp").value;
  });
});

// 填完 Key 失焦后自动拉模型
$("s-key").addEventListener("change", () => {
  saveSettings();
  if ($("s-key").value.trim()) refreshModels();
});

$("btn-settings").onclick = () => settingsEl.classList.toggle("hidden");
$("btn-close-settings").onclick = () => settingsEl.classList.add("hidden");

/* ---------- toast ---------- */
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2500);
}

/* ---------- markdown（零依赖迷你渲染器：先转义再替换） ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
